[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "glyph-sig"
version = "0.1.0"
description = "Deterministic ASCII art signatures derived from document hashes"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "bdfparser",
    "cryptography>=41.0",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
glyph-sig = "glyph_sig.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"glyph_sig.fonts" = ["*.bdf", "LICENCE.txt"]
